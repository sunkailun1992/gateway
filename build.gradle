/*
 * 调用脚本
 */
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.9'
    id 'io.spring.dependency-management' version '1.1.7'
}
/**
 * 项目基础信息
 */
group = 'com.gateway'
version = '1.3.4'
description = 'gateway'

def privateMavenUrl = providers.gradleProperty('privateMavenUrl')
        .orElse(providers.environmentVariable('PRIVATE_MAVEN_URL'))
def privateMavenUsername = providers.gradleProperty('privateMavenUsername')
        .orElse(providers.environmentVariable('PRIVATE_MAVEN_USERNAME'))
def privateMavenPassword = providers.gradleProperty('privateMavenPassword')
        .orElse(providers.environmentVariable('PRIVATE_MAVEN_PASSWORD'))

ext {
    javaReleaseVersion = 21
    springCloudVersion = '2025.1.4'
    springCloudAlibabaVersion = '2025.1.0.0'
    nacosClientVersion = '3.3.0'
    springdocVersion = '3.1.1'
    rpcApiVersion = '1.0.9'
    fleetObservabilityVersion = '0.1.4'
}
/**
 * 编码规则
 */
tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaReleaseVersion as int)
    }
}

springBoot {
    buildInfo()
    mainClass = 'com.kellen.GatewayApplication'
}

/**
 * 镜像仓库地址
 */
repositories {
    mavenLocal()
    mavenCentral()
    maven { url = 'https://maven.aliyun.com/repository/public' }
    if (privateMavenUrl.isPresent()) {
        maven {
            name = 'privateRelease'
            url = uri(privateMavenUrl.get())
            if (privateMavenUsername.isPresent() && privateMavenPassword.isPresent()) {
                credentials {
                    username = privateMavenUsername.get()
                    password = privateMavenPassword.get()
                }
            }
        }
    }
}
/**
 * 打包为 bootJar，可独立运行
 */
bootJar {
    enabled = true
    inputs.property('applicationVersion', project.version) // 固定包名时，版本变化也必须触发重新打包。
    archiveFileName = "${project.name}.jar"
}

test {
    useJUnitPlatform()
    doFirst { systemProperty 'fleet.test.classpath', sourceSets.test.runtimeClasspath.asPath }
}

dependencyManagement {
    imports {
        mavenBom "io.opentelemetry:opentelemetry-bom:1.67.0"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "com.alibaba.cloud:spring-cloud-alibaba-dependencies:${springCloudAlibabaVersion}"
    }
}
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'com.alibaba.nacos'
                && (details.requested.name == 'nacos-client' || details.requested.name.startsWith('nacos-'))) {
            details.useVersion nacosClientVersion
            details.because 'Nacos client must match the 3.3.0 server line used by the shared microservice environment.'
        }
    }
}
/**
 * 引入的jar
 */
dependencies {
    // 补齐 Apple Silicon DNS 原生库；BOM 管版，Linux CI 制品也保留 Mac ARM 支持。
    runtimeOnly 'io.netty:netty-resolver-dns-native-macos::osx-aarch_64'
    implementation "com:rpc-api:${rpcApiVersion}"
    // HTTP 安全终态日志仅引入轻量公共模块，保持网关依赖边界。
    implementation "com:fleet-observability:${fleetObservabilityVersion}"
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery'
    implementation 'com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.opentelemetry:opentelemetry-api:1.67.0'
    // 公共 Instrumenter 提供 HTTP 语义抑制，与 OTel API 1.67.0（Java agent 2.33.1 内置版本）对齐，不建立应用 SDK。
    implementation 'io.opentelemetry.instrumentation:opentelemetry-instrumentation-api:2.33.1'
    implementation 'io.opentelemetry.instrumentation:opentelemetry-reactor-3.1:2.33.1-alpha'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    // BFF：浏览器经 Keycloak 授权码加 PKCE 登录，会话存在 Redis（Spring Session），转发时 TokenRelay 换成 Bearer 访问令牌；
    // 脚本与工具直接带 Bearer 令牌（资源服务器）。网关是 WebFlux，不用 utils 的 servlet 资源服务器自动配置。
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-session-data-redis'
    implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:${springdocVersion}"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
    // 版本跟随 Spring Cloud BOM 管理的 OkHttp（4.12.0），下游服务与令牌端点用它模拟。
    testImplementation 'com.squareup.okhttp3:mockwebserver'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-testing:1.67.0'
    testImplementation 'io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi:1.67.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
