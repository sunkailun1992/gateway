# Gateway CI guards the executable part of the AI coding standard.
# Keep comments at block level so the workflow remains readable.
name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-security:
    name: Build, Test, and Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Checkout rpc-api dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sunkailun1992/rpc-api
          # Match the exact com:rpc-api:1.0.7 dependency when main advances.
          ref: 459e45e2a37d66d1430e871ec2125d7644634c7a
          path: .ci-rpc-api

      - name: Hide CI dependency checkout from scans
        run: |
          echo ".ci-rpc-api/" >> .git/info/exclude
          echo ".ci-utils/" >> .git/info/exclude

      - name: Checkout observability dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: sunkailun1992/utils
          ref: b5a284397bdbfe73bab72ee81855c8e9bf2de5e4 # fleet-observability 0.1.2 / privacy extension 0.1.1
          path: .ci-utils

      - name: Publish lightweight observability to Maven Local
        working-directory: .ci-utils
        run: ./gradlew -q :fleet-observability:publishToMavenLocal

      - name: Publish rpc-api to Maven Local
        working-directory: .ci-rpc-api
        run: ./gradlew -q publishToMavenLocal

      - name: Prepare pinned public agent and privacy extension
        working-directory: .ci-utils
        run: |
          ./gradlew -p ops/github-dev/observability/agent-extension runtimeChecksums --no-daemon
          mkdir -p "$RUNNER_TEMP/gateway-agent"
          cp ops/github-dev/observability/agent-extension/build/runtime/opentelemetry-javaagent-2.33.1.jar "$RUNNER_TEMP/gateway-agent/"
          cp ops/github-dev/observability/agent-extension/build/runtime/fleet-privacy-extension-0.1.1.jar "$RUNNER_TEMP/gateway-agent/"
          cp ops/github-dev/observability/agent-extension/build/runtime/SHA256SUMS "$RUNNER_TEMP/gateway-agent/"
          printf '%s  %s\n' e43a270df53c6f423e0ab157be9c27ccc01d5dc3232e162fe54777573db2f149 "$RUNNER_TEMP/gateway-agent/opentelemetry-javaagent-2.33.1.jar" | sha256sum --check
          (cd "$RUNNER_TEMP/gateway-agent" && sha256sum --check SHA256SUMS)

      - name: Prepare scripts
        run: chmod +x gradlew scripts/check-secrets.sh

      - name: Compile
        run: ./gradlew -q compileJava

      - name: Test
        env:
          FLEET_TEST_AGENT: ${{ runner.temp }}/gateway-agent/opentelemetry-javaagent-2.33.1.jar
          FLEET_TEST_PRIVACY: ${{ runner.temp }}/gateway-agent/fleet-privacy-extension-0.1.1.jar
        run: ./gradlew test

      - name: Secret warning scan
        run: bash scripts/check-secrets.sh
